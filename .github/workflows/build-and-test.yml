name: Run Tests

on:
  push:
    branches:
      - main
      - master
    tags:
      - '**'
  pull_request:
  # Run on merge queue groups.
  merge_group:
    types: [ checks_requested ]
  schedule:
     - cron: '0 6 * * 1' # 6am Monday
  workflow_dispatch:
  workflow_call:

jobs:

  build_exclusions:

    permissions:
      contents: none
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      excludes: ${{ join(steps.*.outputs.excludes) }}
      run_tests: ${{ github.event_name != 'merge_group' }}
    steps:
      - id: no_exclude
        name: Run all builds
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || startsWith(github.ref, 'refs/tags/')
        run: echo 'excludes=[]' >> $GITHUB_OUTPUT
      - id: exclude_master
        name: Exclude beta and non-Linux builds on main/master
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: echo 'excludes=[{"build-version":"beta"},{"os":"windows-latest"},{"os":"macos-latest"}]' >> $GITHUB_OUTPUT
      - id: exclude_pr
        name: Exclude beta, non-Linux, and secondary bots on PRs
        if: github.event_name == 'pull_request'
        run: echo 'excludes=[{"build-version":"beta"},{"os":"windows-latest"},{"os":"macos-latest"}]' >> $GITHUB_OUTPUT
      - id: exclude_merge_group
        name: Exclude all builds except misc if running on merge queue
        if: github.event_name == 'merge_group'
        run: echo 'excludes=[{"build-version":"beta"},{"os":"windows-latest"},{"os":"macos-latest"},{"bot":"dart"}]' >> $GITHUB_OUTPUT

  build:

    name: "${{ matrix.bot }} (${{ matrix.build-version }} ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: build_exclusions

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22]
        build-version: [stable, beta]
        bot: [dart, misc]
        exclude: ${{ fromJSON(needs.build_exclusions.outputs.excludes) }}

    env:
      RUN_TESTS: ${{ needs.build_exclusions.outputs.run_tests }}

    steps:

      - uses: actions/checkout@v7

      - name: Delay on merge queue (to allow testing non-empty merge queue guard)
        if: github.event_name == 'merge_group'
        run: sleep 45
        shell: bash

      - name: Set up Node v${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: npm install
        run: npm install

      - name: npm lint
        run: npm run lint

      - name: npm build
        run: npm run build

      - name: npm test
        if: env.RUN_TESTS == 'true'
        run: npm test

  # A single action based on the test outcome that can be used
  # as a required status check.
  merge-guard:
    permissions:
      contents: none
    name: Merge Guard
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Fail if the build check did not pass.
      - name: Check results
        if: needs.build.result != 'success'
        run: |
          echo "::error title=Merge Guard::One or more build jobs did not succeed (${{ needs.build.result }})."
          exit 1

  notify_failure:

    permissions:
      contents: none
    name: Notify Discord of Failure
    needs: build
    if: failure() && (github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      - name: Log failure
        run: echo "Build failed on $GITHUB_REF ($GITHUB_SHA)"
